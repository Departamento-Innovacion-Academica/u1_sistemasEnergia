<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bibliografía</title>
    <style>
        /* Paleta de colores basada en #582A51 */
        :root {
            --primary: #582A51;
            --primary-dark: #3E1C39;
            --primary-light: #7A3B71;
            --primary-alpha: rgba(88, 42, 81, 0.05);
            --primary-alpha-med: rgba(88, 42, 81, 0.12);
            --bg-body: #F8F5F8;
            --bg-card: #FFFFFF;
            --text-dark: #2C1A2A;
            --text-light: #7A5C76;
            --border-color: #E0D0DF;
            --shadow-color: rgba(88, 42, 81, 0.15);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            background-color: var(--bg-body);
            font-family: 'Segoe UI', Arial, sans-serif;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        .contenedor-flex {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: clamp(20px, 5vw, 60px);
            box-sizing: border-box;
            position: relative;
        }

        /* Instrucción en la esquina superior derecha */
        .instruccion {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--primary);
            color: #FFFFFF;
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 4px 15px var(--shadow-color);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.3px;
            max-width: 350px;
        }

        .instruccion svg {
            width: 16px;
            height: 16px;
            fill: #FFFFFF;
            flex-shrink: 0;
        }

        .contenedor-scroll {
            width: 100%;
            max-width: 1200px;
            height: auto;
            max-height: 90vh;
            overflow-y: auto;
            padding: 60px 20px 20px 20px;
            box-sizing: border-box;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) var(--primary-alpha);
        }

        .contenedor-scroll::-webkit-scrollbar { width: 8px; }
        .contenedor-scroll::-webkit-scrollbar-track { background: var(--primary-alpha); border-radius: 10px; }
        .contenedor-scroll::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        .grid-referencias {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            padding: 10px;
        }

        .referencia {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 2px solid var(--border-color);
            border-radius: 15px;
            padding: 20px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 5px 15px rgba(88, 42, 81, 0.04);
            cursor: pointer;
        }

        .referencia::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s ease;
        }

        .referencia:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 30px var(--shadow-color);
            border-color: var(--primary);
        }

        .referencia:hover::before {
            transform: scaleX(1);
        }

        .referencia h3 {
            color: var(--primary);
            font-size: 13px;
            font-weight: 700;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .referencia p {
            color: var(--text-dark);
            font-size: 14px;
            line-height: 1.6;
            margin: 0;
            flex-grow: 1;
        }

        .referencia .autores {
            font-weight: 600;
            color: var(--primary-dark);
        }

        .referencia .fecha {
            display: inline-block;
            background: var(--primary);
            color: #FFFFFF;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            width: fit-content;
        }

        .referencia .fuente {
            font-size: 13px;
            color: var(--text-light);
            font-style: italic;
        }

        /* Botón "Ver recurso" */
        .enlace-recurso {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--primary);
            color: #FFFFFF;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            margin-top: auto;
            transition: background 0.3s ease, transform 0.2s ease;
            width: fit-content;
        }

        .enlace-recurso:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .enlace-recurso svg {
            width: 14px;
            height: 14px;
        }

        .animar-biblio {
            opacity: 0;
            transform: translateY(20px);
            animation: apareceTarjeta 0.6s ease forwards;
        }

        @keyframes apareceTarjeta {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(44, 26, 42, 0.6);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-overlay.activo {
            display: flex;
            opacity: 1;
        }

        .modal-contenido {
            background: var(--bg-card);
            border-radius: 20px;
            border: 2px solid var(--primary);
            max-width: 600px;
            width: 100%;
            padding: 30px;
            position: relative;
            box-shadow: 0 20px 50px rgba(88, 42, 81, 0.4);
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.activo .modal-contenido {
            transform: translateY(0);
        }

        .modal-contenido h2 {
            color: var(--primary);
            font-size: 22px;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .modal-contenido p {
            color: var(--text-dark);
            font-size: 15px;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .modal-contenido .enlace-modal {
            display: inline-block;
            background: var(--primary);
            color: #FFFFFF;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.3s ease;
        }

        .modal-contenido .enlace-modal:hover {
            background: var(--primary-dark);
        }

        .modal-cerrar {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--primary-alpha);
            border: none;
            color: var(--primary);
            font-size: 20px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .modal-cerrar:hover {
            background: var(--primary);
            color: #FFFFFF;
            transform: rotate(90deg);
        }

        @media (max-width: 768px) {
            .grid-referencias {
                grid-template-columns: 1fr;
            }
            .instruccion {
                top: 10px;
                right: 10px;
                font-size: 11px;
                padding: 8px 14px;
                max-width: 260px;
            }
        }
    </style>
</head>
<body>

    <!-- Instrucción -->
    <div class="instruccion">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
        Haga clic sobre cada referencia para ampliar la información
    </div>

    <div class="contenedor-flex">
        <div class="contenedor-scroll">
            <div class="grid-referencias" id="gridReferencias"></div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay" onclick="cerrarModal(event)">
        <div class="modal-contenido" onclick="event.stopPropagation()">
            <button class="modal-cerrar" onclick="cerrarModal(event)">&times;</button>
            <h2 id="modalTitulo"></h2>
            <p id="modalTexto"></p>
            <a href="#" id="modalEnlace" target="_blank" class="enlace-modal">Ver recurso original</a>
        </div>
    </div>

    <script>
        // Base de datos con todas las referencias
        const referencias = [
            { titulo: "Advancements in Hybrid Energy", texto: "Adeyinka, A. M., & otros. (2024). Advancements in hybrid energy. Sustainable Energy Research, 11(26).", enlace: "https://doi.org/10.1186/s40807-024-00120-4" },
            { titulo: "Pilas de Combustible", texto: "CNH. (2024). Pilas de combustible. Obtenido de Centro Nacional del Hidrógeno.", enlace: "https://www.cnh2.es/pilas-de-combustible/" },
            { titulo: "Renewable Energy Resources", texto: "Ellabban, O., & otros. (2014). Renewable energy resources: Current status, future prospects and their enabling technology. Renewable and Sustainable Energy Reviews, 39, 748-764.", enlace: "https://doi.org/10.1016/j.rser.2014.07.113" },
            { titulo: "Carbon Capture & Storage", texto: "Energy Transitions Commission. (Julio de 2022). Carbon Capture,Utilisation & Storage in the Energy Transition: Vital but Limited. The Making Mission Possible Series, 40-82.", enlace: "https://www.energy-transitions.org/wp-content/uploads/2022/08/ETC-CCUS-Report-V1.9.pdf" },
            { titulo: "Thermal Energy Storage", texto: "ETDE. (2024). Harnessing Heat: The Future of Thermal Energy Storage Technologies. Obtenido de Renewables in Numbers.", enlace: "https://www.etde.org/2024/10/14/harnessing-heat-the-future-of-thermal-energy-storage-technologies/" },
            { titulo: "Sistemas de Energía Eléctrica", texto: "Gómez, E. A., & otros. (2010). Análisis y operación de sistemas de energía eléctrica. Universidad de Sevilla.", enlace: "https://departamento.us.es/ielectrica/wp-content/uploads/2021/08/Analisis-y-operacion-de-SEE_2010.pdf" },
            { titulo: "AI & Smart Grids", texto: "Hashim, S. (2024). The Role of Artificial Intelligence in Modern Smart Grids. Obtenido de Emission Index.", enlace: "https://www.emission-index.com/energy-transition/ai-smart-grids" },
            { titulo: "Radioactive Waste (Safety)", texto: "IAEA. (2009). Classification of Radioactive Waste: Safety Guide. IAEA Safety Standards Series, No. GSG-1(STI/PUB/1419).", enlace: "https://www-pub.iaea.org/MTCD/Publications/PDF/Pub1419_web.pdf" },
            { titulo: "Radioactive Waste (Policies)", texto: "IAEA. (2009). Policies and Strategies for Radioactive Waste Management. IAEA Nuclear Energy Series No. NW-G-1.1(STI/PUB/1396).", enlace: "https://www-pub.iaea.org/MTCD/Publications/PDF/Pub1396_web.pdf" },
            { titulo: "Nuclear Power Plant Design", texto: "International Atomic Energy Agency. (2016). Safety of Nuclear Power Plants: Design. IAEA Safety Standards Series No. SSR-2/1 (Rev. 1)(STI/PUB/1715).", enlace: "https://www-pub.iaea.org/MTCD/Publications/PDF/Pub1715web-46541668.pdf" },
            { titulo: "Energías Renovables (Friedrich)", texto: "Jarabo, F. F., & Elortegui, E. N. (2009). Energías renovables (2da ed.). Madrid: Publicaciones Técnicas, S.L.", enlace: "#" },
            { titulo: "Petroleum Refining", texto: "Kaiser, M. J., de Klerk, A., & Handwerk, G. E. (2019). Petroleum Refining: Technology, Economics, and Markets (6ta ed.). CRC Press.", enlace: "#" },
            { titulo: "Energy Storage Techniques", texto: "Kumar, R., Lee, D., Ağbulut, Ü., et al. (2024). Different energy storage techniques. Journal of Thermal Analysis and Calorimetry, 149(1), 1895-1933.", enlace: "https://doi.org/10.1007/s10973-023-12831-9" },
            { titulo: "Introduction to Nuclear Eng.", texto: "Lamarsh, J. R., & Baratta, A. J. (2001). Introduction to Nuclear Engineering (3ra ed.). Prentice Hall.", enlace: "https://www.engr.psu.edu/conedmat/courses/nuce497a/lamarsh_baratta-introduction_to_nuclear_engineering_textbook_3rd_edition.pdf" },
            { titulo: "El Hidrógeno y la Energía", texto: "Linares, H. J., & Moratilla, S. B. (2007). El hidrógeno y la energía (1ra ed.). Madrid: Universidad Politécnica de Madrid.", enlace: "#" },
            { titulo: "Wind Energy Explained", texto: "Manwell, J. F., & McGowan, J. G. (2009). Wind Energy Explained.", enlace: "https://ee.tlu.edu.vn/Portals/0/2018/NLG/Sach_Tieng_Anh.pdf" },
            { titulo: "Wind Energy: Theory & Design", texto: "Manwell, J. F., McGowan, J. G., & Rogers, A. L. (2009). Wind Energy Explained: Theory, Design, and Application (2da ed.). Chichester, U.K.: John Wiley & Sons.", enlace: "https://ee.tlu.edu.vn/Portals/0/2018/NLG/Sach_Tieng_Anh.pdf" },
            { titulo: "Natural Gas Transmission", texto: "Mokhatab, S., Poe, W. A., & Mak, J. Y. (2015). Handbook of Natural Gas Transmission and Processing (3ra ed.). Gulf Professional Publishing.", enlace: "#" },
            { titulo: "Utility-scale Battery Storage", texto: "National Renewable Energy Laboratory (NREL). (2024). 2024 Annual Technology Baseline: Utility-scale battery storage. Golden, CO, Estados Unidos.", enlace: "https://atb.nrel.gov/electricity/2024/utility-scale_battery_storage" },
            { titulo: "Uranium 2024", texto: "Nuclear Energy Agency. (2024). Uranium 2024: Resources, Production and Demand. Obtenido de Nuclear Energy Agency.", enlace: "https://www.oecd-nea.org/jcms/pl_103179/uranium-2024-resources-production-and-demand?details=true" },
            { titulo: "The Era of Energy Vectors", texto: "Orecchini, F. (2006). The era of energy vectors. International Journal of Hydrogen Energy, 31(14), 1951–1954.", enlace: "https://doi.org/10.1016/j.ijhydene.2006.01.015" },
            { titulo: "Nuclear Decays & Fission", texto: "Poenaru, D. N., & otros. (2022). Short history of nuclear decays including nuclear fission. Advances in Historical Studies, 11(04), 216–250.", enlace: "https://doi.org/10.4236/ahs.2022.114018" },
            { titulo: "Coal Production & Processing", texto: "Riazi, M. R., & Gupta, R. (Edits.). (2015). Coal production and processing technology (1ra ed.). CRC Press.", enlace: "https://doi.org/10.1201/b19352" },
            { titulo: "AI-enhanced Smart Grids", texto: "Saberi, K. M., & otros. (2024). A comprehensive review of AI-enhanced smart grid integration for hydrogen energy. International Journal of Hydrogen Energy, 67, 1009-1025.", enlace: "https://doi.org/10.1016/j.ijhydene.2024.01.129" },
            { titulo: "Física para Ciencias", texto: "Serway, R. A., & Jewett Jr., J. W. (2008). Física para ciencias e ingeniería (7ma ed., Vol. 1). Cengage Learning Editore.", enlace: "#" },
            { titulo: "Energías Renovables (U)", texto: "Solé, A. C. (2014). Energías Renovables (2da ed.). Ediciones de la U.", enlace: "#" },
            { titulo: "Heavy Oil Recovery", texto: "Speight, J. G. (2019). Heavy Oil Recovery and Upgrading. Elsevier.", enlace: "#" },
            { titulo: "Solid Gravity Storage", texto: "Tong, W., Lu, Z., Chen, W., et al. (Septiembre de 2022). Solid gravity energy storage: A review. Journal of Energy Storage, 53, 105226.", enlace: "https://doi.org/10.1016/j.est.2022.105226" },
            { titulo: "Renewable Energy Resources (Twidell)", texto: "Twidell, J., & Weir, T. (2015). Renewable Energy Resources (3ra ed.). London & New York: Taylor & Francis.", enlace: "#" },
            { titulo: "Liquid Air Energy Storage", texto: "Vecchi, A., Li, Y., Ding, Y., et al. (2021). Liquid air energy storage (LAES): a review. Advances in Applied Energy, 3.", enlace: "https://doi.org/10.1016/j.adapen.2021.100047" },
            { titulo: "Gravity Energy Storage Review", texto: "Wang, R., Zhang, L., Shi, C., & Zhao, C. (2025). A Review of Gravity Energy Storage. Energies, 18(7), 1812.", enlace: "https://doi.org/10.3390/en18071812" }
        ];

        // Generar tarjetas dinámicamente
        const grid = document.getElementById('gridReferencias');
        referencias.forEach((ref, index) => {
            const div = document.createElement('div');
            div.className = 'referencia animar-biblio';
            div.style.animationDelay = `${0.1 + index * 0.04}s`;
            div.onclick = () => abrirModal(index);
            div.innerHTML = `
                <h3>${ref.titulo}</h3>
                <p>${ref.texto}</p>
                <a href="${ref.enlace}" target="_blank" class="enlace-recurso" onclick="event.stopPropagation()">Ver recurso <svg fill="currentColor" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7zM19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7z"/></svg></a>
            `;
            grid.appendChild(div);
        });

        function abrirModal(index) {
            const ref = referencias[index];
            document.getElementById('modalTitulo').textContent = ref.titulo;
            document.getElementById('modalTexto').textContent = ref.texto;
            document.getElementById('modalEnlace').href = ref.enlace;
            document.getElementById('modalOverlay').classList.add('activo');
            document.body.style.overflow = 'hidden';
        }

        function cerrarModal(event) {
            if (event) event.stopPropagation();
            document.getElementById('modalOverlay').classList.remove('activo');
            document.body.style.overflow = 'auto';
        }

        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') cerrarModal(); });
    </script>

</body>
</html>
