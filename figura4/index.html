<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producción de Hidrógeno - Flechas Direccionales Corregidas</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Arial, sans-serif;
            box-sizing: border-box;
        }

        .contenedor-svg {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: clamp(20px, 5vw, 80px);
            box-sizing: border-box;
        }

        svg {
            width: 100%;
            height: 100%;
            max-width: 1100px;
            max-height: 700px;
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            preserveAspectRatio="xMidYMid meet"; 
        }

        .box { fill: #ffffff; stroke: #000000; stroke-width: 2; rx: 3; ry: 3; }
        .flow-line { stroke: #000000; stroke-width: 2; fill: none; }
        .flow-line-dashed { stroke: #000000; stroke-width: 1.5; fill: none; stroke-dasharray: 4, 4; }
        .arrow-head { fill: #000000; }
        
        .text-box { font-family: Arial, sans-serif; font-size: 14px; fill: #000000; text-anchor: middle; dominant-baseline: middle; }
        .text-banner { font-family: Arial, sans-serif; font-size: 15px; fill: #000000; text-anchor: middle; dominant-baseline: middle; }

        .animar { opacity: 0; }
    </style>
</head>
<body>

    <div class="contenedor-svg">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -10 900 350" preserveAspectRatio="xMidYMid meet">
          
          <!-- ================= NIVEL 1: FUENTES DE ENERGÍA ================= -->
          <g class="animar">
            <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.2s" fill="freeze" />
            
            <rect x="10" y="10" width="140" height="40" class="box" />
            <text x="80" y="30" class="text-banner">Nuclear energy</text>

            <rect x="180" y="10" width="420" height="40" class="box" />
            <text x="390" y="30" class="text-banner">Renewable energy</text>

            <rect x="640" y="10" width="140" height="40" class="box" />
            <text x="710" y="30" class="text-banner">Fossil energy</text>
          </g>

          <!-- ================= NIVEL 2: HEAT Y BIOMASS ================= -->
          <g class="animar">
            <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.7s" fill="freeze" />
            
            <rect x="10" y="80" width="140" height="40" class="box" />
            <text x="80" y="100" class="text-box">Heat</text>

            <rect x="600" y="80" width="100" height="40" class="box" />
            <text x="650" y="100" class="text-box">Biomass</text>
          </g>

          <!-- ================= NIVEL 3: PROCESOS INTERMEDIOS ================= -->
          <g class="animar">
            <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.9s" fill="freeze" />
            
            <rect x="130" y="150" width="140" height="40" class="box" />
            <text x="200" y="170" class="text-box">Mechanic energy</text>

            <rect x="350" y="140" width="110" height="50" class="box" />
            <text x="405" y="160" class="text-box">Photo-</text>
            <text x="405" y="178" class="text-box">electrolysis</text>

            <rect x="490" y="150" width="120" height="40" class="box" />
            <text x="550" y="170" class="text-box">Fermentation</text>
          </g>

          <!-- ================= NIVEL 4: ELECTRICITY Y CHEMICAL CONVERSION ================= -->
          <g class="animar">
            <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.1s" fill="freeze" />
            
            <rect x="250" y="220" width="120" height="40" class="box" />
            <text x="310" y="240" class="text-box">Electricity</text>

            <rect x="630" y="220" width="160" height="40" class="box" />
            <text x="710" y="240" class="text-box">Chemical conversion</text>
          </g>

          <!-- ================= NIVEL 5: SUBPROCESOS ================= -->
          <g class="animar">
            <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.3s" fill="freeze" />
            
            <rect x="10" y="280" width="150" height="40" class="box" />
            <text x="85" y="300" class="text-box">Thermolysis of water</text>

            <rect x="190" y="280" width="140" height="40" class="box" />
            <text x="260" y="300" class="text-box">Electrolysis</text>

            <rect x="370" y="280" width="140" height="40" class="box" />
            <text x="440" y="300" class="text-box">Biophotolysis</text>
          </g>

          <!-- ================= NIVEL 6: RESULTADOS FINALES ================= -->
          <g class="animar">
            <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.5s" fill="freeze" />
            
            <rect x="10" y="345" width="560" height="35" class="box" />
            <text x="290" y="362.5" class="text-banner">Hidrogen</text>

            <rect x="610" y="345" width="120" height="35" class="box" />
            <text x="670" y="362.5" class="text-banner">CO₂</text>
          </g>

          <!-- ================= CONEXIONES NIVEL 1 -> 2 ================= -->
          <g class="animar">
            <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.7s" fill="freeze" />
            
            <!-- Nuclear -> Heat -->
            <line x1="80" y1="50" x2="80" y2="75" class="flow-line" />
            <polygon points="80,75 75,65 85,65" class="arrow-head" />

            <!-- Renewable -> Biomass -->
            <line x1="650" y1="50" x2="650" y2="75" class="flow-line" />
            <polygon points="650,75 645,65 655,65" class="arrow-head" />

            <!-- Fossil -> Chemical conversion -->
            <line x1="710" y1="50" x2="710" y2="215" class="flow-line" />
            <polygon points="710,215 705,205 715,205" class="arrow-head" />
          </g>

          <!-- ================= CONEXIONES NIVEL 2 -> 3 ================= -->
          <g class="animar">
            <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.9s" fill="freeze" />
            
            <!-- Heat -> Mechanic energy -->
            <path d="M 80 120 L 80 135 L 200 135 L 200 145" class="flow-line" />
            <polygon points="200,145 195,135 205,135" class="arrow-head" />

            <!-- Biomass -> Fermentation -->
            <path d="M 650 120 L 650 135 L 550 135 L 550 145" class="flow-line" />
            <polygon points="550,145 545,135 555,135" class="arrow-head" />

            <!-- Biomass -> Chemical conversion -->
            <path d="M 650 120 L 650 135 L 710 135 L 710 215" class="flow-line" />
            <polygon points="710,215 705,205 715,205" class="arrow-head" />
          </g>

          <!-- ================= CONEXIONES NIVEL 1 -> 3 ================= -->
          <g class="animar">
            <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.9s" fill="freeze" />
            
            <!-- Renewable -> Photo-electrolysis -->
            <line x1="405" y1="50" x2="405" y2="135" class="flow-line" />
            <polygon points="405,135 400,125 410,125" class="arrow-head" />

            <!-- Renewable -> Fermentation -->
            <line x1="550" y1="50" x2="550" y2="145" class="flow-line" />
            <polygon points="550,145 545,135 555,135" class="arrow-head" />

            <!-- Renewable -> Biophotolysis -->
            <line x1="470" y1="50" x2="470" y2="275" class="flow-line" />
            <polygon points="470,275 465,265 475,265" class="arrow-head" />
          </g>

          <!-- ================= CONEXIONES NIVEL 3 -> 4 ================= -->
          <g class="animar">
            <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.1s" fill="freeze" />
            
            <!-- Photo-electrolysis -> Electricity -->
            <path d="M 405 190 L 405 240 L 375 240" class="flow-line" />
            <polygon points="375,240 385,235 385,245" class="arrow-head" />

            <!-- Mechanic energy -> Electricity (Flecha apuntando HACIA LA DERECHA) -->
            <path d="M 200 190 L 200 240 L 245 240" class="flow-line" />
            <polygon points="245,240 235,235 235,245" class="arrow-head" />
          </g>

          <!-- ================= CONEXIONES NIVEL 3 -> 6 ================= -->
          <g class="animar">
            <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.5s" fill="freeze" />
            
            <!-- Fermentation -> Hidrogen -->
            <line x1="550" y1="190" x2="550" y2="340" class="flow-line" />
            <polygon points="550,340 545,330 555,330" class="arrow-head" />
          </g>

          <!-- ================= CONEXIONES NIVEL 4 -> 5 Y NIVEL 4 -> 6 ================= -->
          <g class="animar">
            <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.5s" fill="freeze" />
            
            <!-- Electricity -> Electrolysis -->
            <line x1="310" y1="260" x2="310" y2="275" class="flow-line" />
            <polygon points="310,275 305,265 315,265" class="arrow-head" />

            <!-- Chemical conversion -> CO2 -->
            <line x1="710" y1="260" x2="710" y2="340" class="flow-line" />
            <polygon points="710,340 705,330 715,330" class="arrow-head" />
          </g>

          <!-- ================= CONEXIONES NIVEL 5 -> 6 ================= -->
          <g class="animar">
            <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.7s" fill="freeze" />
            
            <!-- Thermolysis -> Hydrogen -->
            <line x1="85" y1="320" x2="85" y2="340" class="flow-line" />
            <polygon points="85,340 80,330 90,330" class="arrow-head" />

            <!-- Electrolysis -> Hydrogen -->
            <line x1="260" y1="320" x2="260" y2="340" class="flow-line" />
            <polygon points="260,340 255,330 265,330" class="arrow-head" />

            <!-- Biophotolysis -> Hydrogen -->
            <line x1="440" y1="320" x2="440" y2="340" class="flow-line" />
            <polygon points="440,340 435,330 445,330" class="arrow-head" />
          </g>

          <!-- ================= LÍNEAS DE HEAT (SÓLIDA Y PUNTEADA) ================= -->
          <g class="animar">
            <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.9s" fill="freeze" />
            
            <!-- Heat -> Thermolysis of water (LÍNEA SÓLIDA) -->
            <path d="M 80 120 L 80 250 L 60 250 L 60 275" class="flow-line" />
            <polygon points="60,275 55,265 65,265" class="arrow-head" />

            <!-- Heat -> Electrolysis (LÍNEA PUNTEADA apuntando HACIA LA DERECHA) -->
            <path d="M 80 120 L 80 265 L 185 265" class="flow-line-dashed" />
            <polygon points="185,265 175,260 175,270" class="arrow-head" />
          </g>

        </svg>
    </div>

</body>
</html>
